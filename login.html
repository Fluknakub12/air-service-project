<!doctype html>
<html lang="th" class="h-full bg-slate-900">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AirCool Pro - Login Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Google Fonts (Kanit) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Kanit", "sans-serif"] },
          },
        },
      };
    </script>
  </head>
  <body
    class="h-full font-sans antialiased flex items-center justify-center p-4"
  >
    <div
      class="w-full max-w-md bg-slate-800 border border-slate-700/80 rounded-3xl shadow-2xl p-8 space-y-6 text-white"
    >
      <!-- LOGO HEADER -->
      <div class="text-center space-y-2">
        <div
          class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-purple-600 to-violet-400 flex items-center justify-center text-white shadow-xl shadow-purple-900/50"
        >
          <i class="fa-solid font-bold fa-snowflake text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-wide">AirCool Pro Portal</h1>
        <p class="text-xs text-slate-400">
          ระบบจัดการงานบริการล้าง ซ่อม และติดตั้งแอร์
        </p>
      </div>

      <!-- LOGIN FORM -->
      <form onsubmit="handleLogin(event)" class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold mb-1.5 text-slate-300"
            >อีเมลผู้ใช้งาน หรือรหัสสมาชิก</label
          >
          <div class="relative">
            <span
              class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"
            >
              <i class="fa-solid fa-user"></i>
            </span>
            <input
              type="text"
              id="login-user"
              value="CUST-8812"
              class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-white focus:outline-none focus:border-purple-500 transition"
              required
            />
          </div>
        </div>

        <div>
          <label class="block font-semibold mb-1.5 text-slate-300"
            >รหัสผ่าน (Password)</label
          >
          <div class="relative">
            <span
              class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"
            >
              <i class="fa-solid fa-lock"></i>
            </span>
            <input
              type="password"
              id="login-pass"
              value="123456"
              class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-white focus:outline-none focus:border-purple-500 transition"
              required
            />
          </div>
        </div>

        <div>
          <label class="block font-semibold mb-1.5 text-slate-300"
            >เลือกสิทธิ์การใช้งาน (Role)</label
          >
          <select
            id="login-role"
            class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 px-3 text-white focus:outline-none focus:border-purple-500 transition"
          >
            <option value="customer" selected>ลูกค้า (Customer Role)</option>
            <option value="technician">ช่างเทคนิค (Technician Role)</option>
            <option value="admin">ผู้ดูแลระบบ (Admin Role)</option>
          </select>
        </div>

        <button
          type="submit"
          class="w-full py-3.5 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl shadow-lg shadow-purple-600/30 transition text-sm"
        >
          เข้าสู่ระบบ (Login)
        </button>
      </form>

      <!-- DEMO NOTE -->
      <div
        class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 text-[11px] text-slate-400 text-center space-y-1"
      >
        <p class="font-semibold text-purple-300">คำแนะนำการทดสอบระบบ:</p>
        <p>
          เลือก "ลูกค้า (Customer Role)"
          แล้วกดเข้าสู่ระบบเพื่อเชื่อมต่อไปยังหน้า customer.html ทันที
        </p>
      </div>
    </div>

    <!-- TOAST -->
    <div
      id="toast-modal"
      class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 transform opacity-0 translate-y-4 pointer-events-none"
    >
      <div
        class="bg-slate-900/95 text-white px-4 py-2.5 rounded-2xl shadow-2xl border border-slate-700 flex items-center space-x-3 text-xs font-semibold"
      >
        <div
          class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center"
        >
          <i class="fa-solid fa-check"></i>
        </div>
        <span id="toast-message">Success</span>
      </div>
    </div>

    <!-- SCRIPT -->
    <script>
      function showToast(message) {
        const toast = document.getElementById("toast-modal");
        document.getElementById("toast-message").innerText = message;
        toast.classList.remove(
          "opacity-0",
          "translate-y-4",
          "pointer-events-none",
        );
        toast.classList.add("opacity-100", "translate-y-0");
        setTimeout(() => {
          toast.classList.remove("opacity-100", "translate-y-0");
          toast.classList.add(
            "opacity-0",
            "translate-y-4",
            "pointer-events-none",
          );
        }, 2000);
      }

      async function handleLogin(e) {
        e.preventDefault();
        const username = document.getElementById("login-user").value.trim();
        const password = document.getElementById("login-pass").value;
        const role = document.getElementById("login-role").value;

        try {
          // เชื่อมต่อ Backend API สำหรับตรวจสอบการเข้าสู่ระบบ
          const response = await fetch("http://localhost:3000/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password, role }),
          });

          const result = await response.json();

          if (response.ok && result.success) {
            // บันทึกสิทธิ์และข้อมูลผู้ใช้ลงใน localStorage
            localStorage.setItem("aircool_user_role", role);
            localStorage.setItem(
              "aircool_user_code",
              result.userCode || username,
            );

            showToast("เข้าสู่ระบบสำเร็จ กำลังพาไปยังหน้าพอร์ทัล...");

            setTimeout(() => {
              if (role === "customer") {
                window.location.href = "customer.html";
              } else if (role === "technician") {
                window.location.href = "technician.html";
              } else {
                window.location.href = "admin.html";
              }
            }, 1000);
          } else {
            showToast(result.message || "ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง");
          }
        } catch (err) {
          console.error("Login connection error:", err);
          // Fallback กรณีไม่ได้รัน Backend ให้สามารถกดเข้าใช้งานระบบทดสอบหน้าจอต่อได้ทันที
          localStorage.setItem("aircool_user_role", role);
          localStorage.setItem("aircool_user_code", username);

          showToast("เข้าสู่ระบบจำลองสำเร็จ (Offline Mode)");
          setTimeout(() => {
            if (role === "customer") {
              window.location.href = "customer.html";
            } else if (role === "technician") {
              window.location.href = "technician.html";
            } else {
              window.location.href = "admin.html";
            }
          }, 1000);
        }
      }
    </script>
  </body>
</html>
